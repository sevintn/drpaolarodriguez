<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2e5c99"/>
    </linearGradient>
    <linearGradient id="kidneyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#ddeeff"/>
    </linearGradient>
    <filter id="kshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
    <!-- Subtle top glare -->
    <radialGradient id="glare" cx="40%" cy="25%" r="55%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <circle cx="250" cy="250" r="250" fill="url(#bgGrad)"/>
  <circle cx="250" cy="250" r="250" fill="url(#glare)"/>
  <circle cx="250" cy="250" r="245" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="2.5"/>

  <!-- LEFT KIDNEY (convex outer left, concave inner right = hilum) -->
  <path d="
    M 185 125
    C 210 125 225 145 224 170
    C 223 193 212 208 207 227
    C 204 240 206 257 205 272
    C 205 285 196 298 183 298
    C 162 298 143 283 138 263
    C 133 242 132 216 135 193
    C 138 170 145 148 159 135
    C 169 128 178 125 185 125 Z
  " fill="url(#kidneyGrad)" filter="url(#kshadow)"/>

  <!-- Left kidney hilum line -->
  <path d="M 216 165 C 210 190 206 215 207 242"
    fill="none" stroke="#2e5c99" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- RIGHT KIDNEY (mirror of left: convex outer right, concave inner left = hilum) -->
  <path d="
    M 315 125
    C 290 125 275 145 276 170
    C 277 193 288 208 293 227
    C 296 240 294 257 295 272
    C 295 285 304 298 317 298
    C 338 298 357 283 362 263
    C 367 242 368 216 365 193
    C 362 170 355 148 341 135
    C 331 128 322 125 315 125 Z
  " fill="url(#kidneyGrad)" filter="url(#kshadow)"/>

  <!-- Right kidney hilum line -->
  <path d="M 284 165 C 290 190 294 215 293 242"
    fill="none" stroke="#2e5c99" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Separator -->
  <line x1="115" y1="322" x2="385" y2="322" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Name -->
  <text x="250" y="360"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="25"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="0.5">Dra. Paola Rodríguez Ramos</text>

  <!-- Specialty -->
  <text x="250" y="400"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="20"
    fill="rgba(255,255,255,0.75)"
    text-anchor="middle"
    letter-spacing="5">NEFRÓLOGA</text>

</svg>
